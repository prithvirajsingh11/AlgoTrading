  <text x="730" y="485" fill="#94a3b8" font-size="11">Warmup Bars Enforced: 51 Bars</text>
  <text x="730" y="510" fill="#94a3b8" font-size="11">Artifact Path: data/models/model_v1.0.0.json</text>
