<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" style="background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Header Bar -->
  <rect x="0" y="0" width="1200" height="50" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="25" cy="25" r="7" fill="#3b82f6"/>
  <text x="42" y="30" fill="#f8fafc" font-size="15" font-weight="700" letter-spacing="1">ALGOTRADE</text>
  <rect x="150" y="14" width="55" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="177" y="29" fill="#94a3b8" font-size="10" text-anchor="middle" font-weight="600">v1.0.0</text>
  <rect x="220" y="12" width="280" height="26" rx="4" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="1"/>
  <text x="360" y="29" fill="#ef4444" font-size="11" text-anchor="middle" font-weight="700" letter-spacing="0.5">⚠️ SIMULATION ONLY — NO REAL MONEY</text>
  <text x="1175" y="30" fill="#10b981" font-size="12" text-anchor="end" font-weight="600">● SYSTEM HEALTHY</text>

  <!-- Sidebar -->
  <rect x="0" y="50" width="180" height="650" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="20" y="85" fill="#94a3b8" font-size="13">Dashboard</text>
  <text x="20" y="125" fill="#94a3b8" font-size="13">Backtests</text>
  <text x="20" y="165" fill="#3b82f6" font-size="13" font-weight="700">▶ Comparison</text>
  <text x="20" y="205" fill="#94a3b8" font-size="13">ML Lab</text>
  <text x="20" y="245" fill="#94a3b8" font-size="13">Jev Lab</text>
  <text x="20" y="285" fill="#94a3b8" font-size="13">Paper Trading</text>
  <text x="20" y="325" fill="#94a3b8" font-size="13">Settings</text>

  <!-- Title -->
  <text x="210" y="85" fill="#f8fafc" font-size="20" font-weight="700">Quantitative Strategy Comparison Matrix</text>
  <text x="210" y="105" fill="#64748b" font-size="12">Side-by-side risk-adjusted performance benchmarking across identical market regimes</text>

  <!-- Comparison Table Card -->
  <rect x="210" y="125" width="960" height="230" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="230" y="155" fill="#38bdf8" font-size="14" font-weight="700">STRATEGY BENCHMARK TABLE</text>
  
  <text x="230" y="185" fill="#64748b" font-size="11" font-weight="700">STRATEGY NAME</text>
  <text x="460" y="185" fill="#64748b" font-size="11" font-weight="700">TOTAL RETURN</text>
  <text x="610" y="185" fill="#64748b" font-size="11" font-weight="700">SHARPE RATIO</text>
  <text x="760" y="185" fill="#64748b" font-size="11" font-weight="700">MAX DRAWDOWN</text>
  <text x="910" y="185" fill="#64748b" font-size="11" font-weight="700">WIN RATE</text>
  <text x="1060" y="185" fill="#64748b" font-size="11" font-weight="700">TRADES</text>
  <line x1="230" y1="195" x2="1150" y2="195" stroke="#334155" stroke-width="1"/>

  <!-- Row 1 -->
  <circle cx="235" cy="225" r="4" fill="#3b82f6"/>
  <text x="245" y="230" fill="#f8fafc" font-size="12" font-weight="600">TimeSeriesMomentum</text>
  <text x="460" y="230" fill="#10b981" font-size="12" font-weight="700">+4.31%</text>
  <text x="610" y="230" fill="#f8fafc" font-size="12">0.5225</text>
  <text x="760" y="230" fill="#f87171" font-size="12">1.93%</text>
  <text x="910" y="230" fill="#f8fafc" font-size="12">60.0%</text>
  <text x="1060" y="230" fill="#f8fafc" font-size="12">4</text>
  <line x1="230" y1="245" x2="1150" y2="245" stroke="#334155" stroke-width="1"/>

  <!-- Row 2 -->
  <circle cx="235" cy="275" r="4" fill="#10b981"/>
  <text x="245" y="280" fill="#f8fafc" font-size="12" font-weight="600">MovingAverageCross</text>
  <text x="460" y="280" fill="#10b981" font-size="12" font-weight="700">+4.11%</text>
  <text x="610" y="280" fill="#f8fafc" font-size="12">0.4610</text>
  <text x="760" y="280" fill="#f87171" font-size="12">1.71%</text>
  <text x="910" y="280" fill="#f8fafc" font-size="12">60.0%</text>
  <text x="1060" y="280" fill="#f8fafc" font-size="12">5</text>
  <line x1="230" y1="295" x2="1150" y2="295" stroke="#334155" stroke-width="1"/>

  <!-- Row 3 -->
  <circle cx="235" cy="325" r="4" fill="#f59e0b"/>
  <text x="245" y="330" fill="#f8fafc" font-size="12" font-weight="600">MeanReversion</text>
  <text x="460" y="330" fill="#fbbf24" font-size="12" font-weight="700">+0.79%</text>
  <text x="610" y="330" fill="#f8fafc" font-size="12">-0.5412</text>
  <text x="760" y="330" fill="#f87171" font-size="12">2.98%</text>
  <text x="910" y="330" fill="#f8fafc" font-size="12">40.0%</text>
  <text x="1060" y="330" fill="#f8fafc" font-size="12">5</text>

  <!-- Multi-Strategy Comparative Equity Curve Chart -->
  <rect x="210" y="375" width="960" height="300" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="230" y="405" fill="#f8fafc" font-size="14" font-weight="700">Comparative Equity Growth Over Time</text>
  
  <!-- Line 1: Momentum (Blue) -->
  <polyline points="240,610 330,590 420,600 510,570 600,540 690,550 780,510 870,520 960,470 1050,450 1140,440" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="1145" y="443" fill="#3b82f6" font-size="10" font-weight="700">Momentum</text>

  <!-- Line 2: MA Cross (Emerald) -->
  <polyline points="240,610 330,605 420,595 510,580 600,560 690,565 780,530 870,535 960,490 1050,470 1140,460" fill="none" stroke="#10b981" stroke-width="2.5"/>
  <text x="1145" y="463" fill="#10b981" font-size="10" font-weight="700">MA Cross</text>

  <!-- Line 3: Mean Reversion (Amber) -->
  <polyline points="240,610 330,620 420,605 510,630 600,615 690,625 780,590 870,610 960,595 1050,605 1140,590" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="1145" y="593" fill="#f59e0b" font-size="10" font-weight="700">Mean Rev</text>
</svg>
